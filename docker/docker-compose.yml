services:
  db:
    # ЗМІНЕНО: Використовуємо образ з вбудованим pgvector замість postgres:15-alpine
    image: pgvector/pgvector:pg15
    container_name: movie_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: movie_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ../movie-backend
      dockerfile: Dockerfile
    container_name: movie_nestjs
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TMDB_API_TOKEN=${TMDB_API_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ../movie-frontend # <-- Додали ../
      dockerfile: Dockerfile
    container_name: movie_react
    restart: always
    env_file: .env
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY}
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
